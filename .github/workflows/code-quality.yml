---
name: Code Quality

"on":
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  code-quality:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      security-events: write
    uses: ministryofjustice/modernisation-platform-github-actions/.github/workflows/reusable-code-quality.yml@8e5925381920e65150b186f6e9373c28b7be3202 # latest commit
    with:
      validate_all_codebase: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
