---
name: ♻️ CodeQL Analysis

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  codeql-analysis:
    name: CodeQL Analysis
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ministryofjustice/analytical-platform-github-actions/.github/workflows/reusable-codeql-analysis.yml@fe61ebce4093c531f1cbaa96a01c147b7bf33234 # v8.0.4
    with:
      languages: '["actions", "python"]'
